<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うちのごはん</title>

<style>
:root {
  --bg:#f7f5f0;
  --card:#ffffff;
  --text:#37352f;
  --muted:#8a877f;
  --accent:#7c967b;
  --accent-light:#e8efe5;
  --border:#e9e6df;
  --orange:#d69a69;
  --blue:#829bb4;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}

button,input,select,textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

header {
  background:#fff;
  padding:18px 16px 12px;
  border-bottom:1px solid var(--border);
}

.header-inner {
  max-width:900px;
  margin:auto;
}

.logo {
  font-size:24px;
  font-weight:700;
  letter-spacing:1px;
}

.subtitle {
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

main {
  max-width:900px;
  margin:auto;
  padding:16px;
  padding-bottom:100px;
}

.page-title {
  font-size:21px;
  margin:8px 0 16px;
}

.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

.section-title {
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
}

button.primary {
  background:var(--accent);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px 16px;
}

button.secondary {
  background:var(--accent-light);
  color:#536b52;
  border:0;
  border-radius:10px;
  padding:10px 14px;
}

button.outline {
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 13px;
}

input,select,textarea {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px;
  background:white;
  color:var(--text);
  margin:5px 0 12px;
}

label {
  display:block;
  font-size:13px;
  font-weight:600;
}

.calendar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px;
}

.calendar-month {
  font-size:20px;
  font-weight:700;
}

.calendar-week,
.calendar-grid {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}

.calendar-week div {
  text-align:center;
  padding:8px 0;
  font-size:12px;
  color:var(--muted);
}

.calendar-day {
  min-height:105px;
  border:1px solid var(--border);
  background:#fff;
  padding:5px;
  text-align:left;
  min-width:0;
  border-radius:5px;
  overflow:hidden;
}

.calendar-day.empty {
  background:#f8f7f4;
}

.calendar-day.today {
  background:#f0f5ed;
  border:2px solid var(--accent);
}

.calendar-day.selected {
  outline:2px solid var(--orange);
  outline-offset:-2px;
}

.day-number {
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

.day-menu {
  display:block;
  font-size:10px;
  line-height:1.45;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border-radius:4px;
  padding:2px 3px;
}

.breakfast { background:#fff1d9; }
.lunch { background:#e8f0fa; }
.dinner { background:#f8e9e6; }

.calendar-note {
  font-size:11px;
  color:var(--muted);
  margin-top:10px;
}

.meal-row {
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}

.meal-row:last-child {
  border-bottom:0;
}

.meal-label {
  width:48px;
  flex-shrink:0;
  font-size:13px;
  font-weight:700;
}

.meal-content {
  flex:1;
  min-width:0;
  font-size:14px;
}

.meal-empty {
  color:#aaa;
}

.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:center;
  z-index:10;
  padding:7px 3px calc(7px + env(safe-area-inset-bottom));
}

.nav-inner {
  width:100%;
  max-width:700px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-button {
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  padding:6px 2px;
}

.nav-button span {
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav-button.active {
  color:var(--accent);
  font-weight:700;
}

.hidden { display:none !important; }

@media(max-width:500px) {
  main { padding:10px; padding-bottom:100px; }
  .calendar-day { min-height:83px; padding:3px; }
  .day-menu { font-size:9px; }
  .calendar-month { font-size:18px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🍚 うちのごはん</div>
    <div class="subtitle">毎日のごはんを、もっと楽しく。</div>
  </div>
</header>

<main>

<section id="homePage">

  <h1 class="page-title">献立カレンダー</h1>

  <div class="card">

    <div class="calendar-head">
      <button class="outline" id="prevMonth">‹</button>
      <div class="calendar-month" id="calendarMonth"></div>
      <button class="outline" id="nextMonth">›</button>
    </div>

    <div class="calendar-week">
      <div style="color:#d66">日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div style="color:#579">土</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="calendar-note">
      🍳 朝　🍱 昼　🍽 夕
      <br>
      日付を押すと、その日の献立を確認できます。
    </div>

  </div>

  <div class="card">
    <div class="section-title" id="selectedDateTitle">
      今日の献立
    </div>

    <div id="selectedMeals">

      <div class="meal-row">
        <div class="meal-label">朝 🍳</div>
        <div class="meal-content meal-empty">献立はまだありません</div>
      </div>

      <div class="meal-row">
        <div class="meal-label">昼 🍱</div>
        <div class="meal-content meal-empty">献立はまだありません</div>
      </div>

      <div class="meal-row">
        <div class="meal-label">夕 🍽</div>
        <div class="meal-content meal-empty">献立はまだありません</div>
      </div>

    </div>

    <button class="secondary" id="editSelectedMeal">
      この日の献立を編集
    </button>

  </div>

</section>

<section id="mealPage" class="hidden">

  <h1 class="page-title">🍽 献立作成</h1>

  <div class="card">
    <div class="section-title">献立の条件</div>

    <label>何人分？</label>
    <input id="planPeople" type="number" min="1" max="30" value="4">

    <label>何日分？</label>
    <select id="planDays">
      <option value="1">1日分</option>
      <option value="3">3日分</option>
      <option value="5">5日分</option>
      <option value="7" selected>7日分</option>
    </select>

    <label>朝食の予算（1人1食・円）</label>
    <input id="breakfastBudget" type="number" min="0" value="150">

    <label>昼食の予算（1人1食・円）</label>
    <input id="lunchBudget" type="number" min="0" value="300">

    <label>夕食の予算（1人1食・円）</label>
    <input id="dinnerBudget" type="number" min="0" value="500">

    <label>使いたい食材</label>
    <input id="planIngredients"
      placeholder="例：鶏むね肉、キャベツ、卵">

    <label>避けたい食材・料理</label>
    <input id="planAvoid"
      placeholder="例：魚、辛い料理">

    <label>調理時間の目安</label>
    <select id="planCookingTime">
      <option value="15">15分以内</option>
      <option value="30" selected>30分以内</option>
      <option value="45">45分以内</option>
      <option value="60">60分以内</option>
      <option value="999">時間制限なし</option>
    </select>

    <button class="primary" id="makePlan" style="width:100%">
      献立を作る
    </button>
  </div>

  <div class="card">
    <div class="section-title">作成した献立</div>
    <div id="mealPlanResult">
      まだ献立は作成されていません。
    </div>

    <button class="primary hidden" id="saveMealPlan"
      style="width:100%;margin-top:12px">
      カレンダーに保存する
    </button>
  </div>

</section>

<section id="recipePage" class="hidden">

  <h1 class="page-title">📖 レシピ帳</h1>

  <div class="card">
    <div class="section-title">レシピを検索</div>
    <input id="recipeSearch" type="search"
      placeholder="料理名・材料・カテゴリーで検索">

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="secondary" id="showAllRecipes">すべて</button>
      <button class="secondary" id="showFavoriteRecipes">お気に入り</button>
      <button class="secondary" id="showAddRecipe">＋ レシピ登録</button>
    </div>
  </div>

  <div id="recipeListArea">
    <div class="section-title">登録レシピ</div>
    <div id="recipeList"></div>
  </div>

  <div id="recipeFormArea" class="card hidden">

    <div class="section-title" id="recipeFormTitle">
      新しいレシピ
    </div>

    <label>料理名</label>
    <input id="recipeName" placeholder="例：鶏肉の照り焼き">

    <label>カテゴリー</label>
    <select id="recipeCategory">
      <option value="主食">主食</option>
      <option value="主菜">主菜</option>
      <option value="副菜">副菜</option>
      <option value="汁物">汁物</option>
      <option value="小鉢">小鉢</option>
      <option value="お弁当">お弁当</option>
      <option value="その他">その他</option>
    </select>

    <label>何人分</label>
    <input id="recipeServings" type="number" min="1" value="2">

    <label>材料・分量</label>
    <textarea id="recipeIngredients" rows="6"
      placeholder="鶏もも肉 300g&#10;醤油 大さじ2&#10;みりん 大さじ2"></textarea>

    <label>作り方</label>
    <textarea id="recipeSteps" rows="7"
      placeholder="1. 鶏肉を食べやすい大きさに切る&#10;2. フライパンで焼く"></textarea>

    <label>調理時間（分）</label>
    <input id="recipeTime" type="number" min="0" placeholder="20">

    <label>予算（円）</label>
    <input id="recipeBudget" type="number" min="0" placeholder="500">

    <label>元のレシピサイトURL</label>
    <input id="recipeSource" type="url" placeholder="https://...">

    <label>メモ・味付けのポイント</label>
    <textarea id="recipeMemo" rows="3"></textarea>

    <label>写真URL</label>
    <input id="recipePhoto" type="url" placeholder="https://...">

    <div style="display:flex;gap:8px">
      <button class="primary" id="saveRecipe">保存する</button>
      <button class="outline" id="cancelRecipe">キャンセル</button>
    </div>

  </div>

  <div id="recipeDetailArea" class="card hidden">
    <div id="recipeDetail"></div>
    <button class="outline" id="closeRecipeDetail">戻る</button>
  </div>

</section>

<section id="bentoPage" class="hidden">
  <h1 class="page-title">🍱 お弁当</h1>
  <div class="card">
    <p>お弁当作成機能をここに追加します。</p>
  </div>
</section>

<section id="pantryPage" class="hidden">
  <h1 class="page-title">🧺 食材・買い物</h1>
  <div class="card">
    <p>冷蔵庫・買い物リスト機能をここに追加します。</p>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-button active" data-page="homePage">
      <span>📅</span>カレンダー
    </button>

    <button class="nav-button" data-page="mealPage">
      <span>🍽</span>献立
    </button>

    <button class="nav-button" data-page="recipePage">
      <span>📖</span>レシピ
    </button>

    <button class="nav-button" data-page="bentoPage">
      <span>🍱</span>お弁当
    </button>

    <button class="nav-button" data-page="pantryPage">
      <span>🧺</span>食材
    </button>

  </div>
</nav>

<script>
/* =====================================
   うちのごはん 基本データ
===================================== */

const STORAGE_KEYS = {
  recipes:"uchiRecipes",
  plans:"uchiMealPlans",
  pantry:"uchiPantry",
  shopping:"uchiShoppingList",
  history:"uchiMealHistory",
  bentos:"uchiSavedBentos",
  favorites:"uchiFavorites"
};

function readData(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch(error) {
    console.error("保存データの読み込みエラー:",key,error);
    return fallback;
  }
}

function saveData(key,value) {
  try {
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  } catch(error) {
    console.error("保存エラー:",key,error);
    alert("保存できませんでした。端末の空き容量やブラウザ設定を確認してください。");
    return false;
  }
}

/* 既存データを読み込む */
let recipes = readData(STORAGE_KEYS.recipes,[]);
let mealPlans = readData(STORAGE_KEYS.plans,{});
let pantry = readData(STORAGE_KEYS.pantry,[]);
let shoppingList = readData(STORAGE_KEYS.shopping,[]);
let mealHistory = readData(STORAGE_KEYS.history,[]);
let savedBentos = readData(STORAGE_KEYS.bentos,[]);
let favorites = readData(STORAGE_KEYS.favorites,[]);

/* =====================================
   カレンダー
===================================== */

let calendarDate = new Date();
let selectedDate = new Date();

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function getPlan(date) {
  const key = dateKey(date);
  return mealPlans[key] || {};
}

function renderCalendar() {

  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  document.getElementById("calendarMonth").textContent =
    `${year}年 ${month+1}月`;

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  const firstDay = new Date(year,month,1).getDay();
  const lastDate = new Date(year,month+1,0).getDate();

  const todayKey = dateKey(new Date());
  const selectedKey = dateKey(selectedDate);

  for(let i=0;i<firstDay;i++) {
    const empty = document.createElement("div");
    empty.className = "calendar-day empty";
    grid.appendChild(empty);
  }

  for(let day=1;day<=lastDate;day++) {

    const date = new Date(year,month,day);
    const key = dateKey(date);
    const plan = getPlan(date);

    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "calendar-day";

    if(key === todayKey) cell.classList.add("today");
    if(key === selectedKey) cell.classList.add("selected");

    const number = document.createElement("div");
    number.className = "day-number";
    number.textContent = day;
    cell.appendChild(number);

    const meals = [
      ["朝","breakfast",plan.breakfast],
      ["昼","lunch",plan.lunch],
      ["夕","dinner",plan.dinner]
    ];

    meals.forEach(([label,className,meal]) => {
      if(!meal) return;

      const menu = document.createElement("span");
      menu.className = `day-menu ${className}`;
      menu.textContent = `${label} ${getMealName(meal)}`;
      menu.title = `${label} ${getMealName(meal)}`;
      cell.appendChild(menu);
    });

    cell.addEventListener("click",()=>{
      selectedDate = date;
      renderCalendar();
      renderSelectedMeals();
    });

    grid.appendChild(cell);
  }

}

function getMealName(meal) {
  if(typeof meal === "string") return meal;
  if(meal && typeof meal === "object") {
    return meal.name || meal.title || "献立あり";
  }
  return "";
}

function renderSelectedMeals() {

  const plan = getPlan(selectedDate);

  document.getElementById("selectedDateTitle").textContent =
    `${selectedDate.getFullYear()}年${selectedDate.getMonth()+1}月${selectedDate.getDate()}日の献立`;

  const container = document.getElementById("selectedMeals");
  container.innerHTML = "";

  const meals = [
    ["朝 🍳","breakfast"],
    ["昼 🍱","lunch"],
    ["夕 🍽","dinner"]
  ];

  meals.forEach(([label,key])=>{

    const row = document.createElement("div");
    row.className = "meal-row";

    const labelDiv = document.createElement("div");
    labelDiv.className = "meal-label";
    labelDiv.textContent = label;

    const content = document.createElement("div");
    content.className = "meal-content";

    const name = getMealName(plan[key]);

    if(name) {
      content.textContent = name;
    } else {
      content.textContent = "献立はまだありません";
      content.classList.add("meal-empty");
    }

    row.appendChild(labelDiv);
    row.appendChild(content);
    container.appendChild(row);

  });

}

/* =====================================
   月移動
===================================== */

document.getElementById("prevMonth").addEventListener("click",()=>{
  calendarDate.setMonth(calendarDate.getMonth()-1);
  renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click",()=>{
  calendarDate.setMonth(calendarDate.getMonth()+1);
  renderCalendar();
});

/* =====================================
   下部メニュー切り替え
===================================== */

function showPage(pageId) {

  document.querySelectorAll("main > section").forEach(section=>{
    section.classList.add("hidden");
  });

  const target = document.getElementById(pageId);
  if(target) target.classList.remove("hidden");

  document.querySelectorAll(".nav-button").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.page === pageId
    );
  });

}

document.querySelectorAll(".nav-button").forEach(button=>{
  button.addEventListener("click",()=>{
    showPage(button.dataset.page);
  });
});

/* =====================================
   献立編集画面への移動
===================================== */

document.getElementById("editSelectedMeal").addEventListener("click",()=>{
  showPage("mealPage");
});

/* =====================================
   初期表示
===================================== */

renderCalendar();
renderSelectedMeals();

  /* =====================================
   レシピ管理
===================================== */

let editingRecipeId = null;
let recipeFilter = "all";

function createRecipeId() {
  return "recipe_" + Date.now() + "_" +
    Math.random().toString(36).slice(2,8);
}

function saveRecipes() {
  saveData(STORAGE_KEYS.recipes,recipes);
}

function normalizeRecipe(recipe) {
  return {
    id: recipe.id || createRecipeId(),
    name: recipe.name || recipe.title || "",
    category: recipe.category || "その他",
    servings: Number(recipe.servings || recipe.people || 2),
    ingredients: recipe.ingredients || "",
    steps: recipe.steps || recipe.method || "",
    time: Number(recipe.time || 0),
    budget: Number(recipe.budget || 0),
    source: recipe.source || recipe.url || "",
    memo: recipe.memo || recipe.tip || "",
    photo: recipe.photo || recipe.image || "",
    favorite: Boolean(recipe.favorite)
  };
}

recipes = Array.isArray(recipes)
  ? recipes.map(normalizeRecipe)
  : [];

saveRecipes();

/* レシピ一覧 */

function renderRecipeList() {

  const list = document.getElementById("recipeList");
  if(!list) return;

  const keyword =
    (document.getElementById("recipeSearch").value || "")
      .trim().toLowerCase();

  let filtered = recipes.filter(recipe => {

    if(recipeFilter === "favorite" &&
       !recipe.favorite &&
       !favorites.includes(recipe.id)) {
      return false;
    }

    const text = [
      recipe.name,
      recipe.category,
      recipe.ingredients,
      recipe.memo
    ].join(" ").toLowerCase();

    return text.includes(keyword);
  });

  list.innerHTML = "";

  if(filtered.length === 0) {
    list.innerHTML =
      '<div class="card">レシピがありません。<br>「＋ レシピ登録」から追加できます。</div>';
    return;
  }

  filtered.forEach(recipe => {

    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("div");
    title.style.fontWeight = "700";
    title.style.fontSize = "16px";
    title.textContent = recipe.name;

    const category = document.createElement("div");
    category.style.fontSize = "12px";
    category.style.color = "#888";
    category.style.margin = "5px 0";
    category.textContent =
      `${recipe.category} ・ ${recipe.servings}人分` +
      (recipe.time ? ` ・ ${recipe.time}分` : "");

    const favorite = document.createElement("button");
    favorite.className = "outline";
    favorite.textContent =
      recipe.favorite || favorites.includes(recipe.id)
        ? "★ お気に入り"
        : "☆ お気に入り";

    favorite.addEventListener("click",event => {
      event.stopPropagation();
      toggleRecipeFavorite(recipe.id);
    });

    const detailButton = document.createElement("button");
    detailButton.className = "secondary";
    detailButton.textContent = "レシピを見る";
    detailButton.addEventListener("click",()=>{
      showRecipeDetail(recipe.id);
    });

    card.appendChild(title);
    card.appendChild(category);

    if(recipe.photo) {
      const img = document.createElement("img");
      img.src = recipe.photo;
      img.alt = recipe.name;
      img.style.width = "100%";
      img.style.maxHeight = "180px";
      img.style.objectFit = "cover";
      img.style.borderRadius = "10px";
      img.style.marginBottom = "10px";
      img.onerror = () => img.remove();
      card.appendChild(img);
    }

    card.appendChild(favorite);
    card.appendChild(detailButton);
    list.appendChild(card);

  });

}

/* お気に入り */

function toggleRecipeFavorite(id) {

  const recipe = recipes.find(item => item.id === id);
  if(!recipe) return;

  recipe.favorite = !recipe.favorite;

  if(recipe.favorite) {
    if(!favorites.includes(id)) favorites.push(id);
  } else {
    favorites = favorites.filter(item => item !== id);
  }

  saveRecipes();
  saveData(STORAGE_KEYS.favorites,favorites);
  renderRecipeList();
}

/* 登録画面 */

function openRecipeForm(id = null) {

  editingRecipeId = id;

  const form = document.getElementById("recipeFormArea");
  const list = document.getElementById("recipeListArea");
  const detail = document.getElementById("recipeDetailArea");

  list.classList.add("hidden");
  detail.classList.add("hidden");
  form.classList.remove("hidden");

  const recipe = id
    ? recipes.find(item => item.id === id)
    : null;

  document.getElementById("recipeFormTitle").textContent =
    recipe ? "レシピを編集" : "新しいレシピ";

  document.getElementById("recipeName").value =
    recipe?.name || "";

  document.getElementById("recipeCategory").value =
    recipe?.category || "主菜";

  document.getElementById("recipeServings").value =
    recipe?.servings || 2;

  document.getElementById("recipeIngredients").value =
    recipe?.ingredients || "";

  document.getElementById("recipeSteps").value =
    recipe?.steps || "";

  document.getElementById("recipeTime").value =
    recipe?.time || "";

  document.getElementById("recipeBudget").value =
    recipe?.budget || "";

  document.getElementById("recipeSource").value =
    recipe?.source || "";

  document.getElementById("recipeMemo").value =
    recipe?.memo || "";

  document.getElementById("recipePhoto").value =
    recipe?.photo || "";

}

/* レシピ保存 */

function saveRecipeForm() {

  const name =
    document.getElementById("recipeName").value.trim();

  if(!name) {
    alert("料理名を入力してください。");
    return;
  }

  const recipe = {
    id: editingRecipeId || createRecipeId(),
    name,
    category:document.getElementById("recipeCategory").value,
    servings:Math.max(1,Number(
      document.getElementById("recipeServings").value || 1
    )),
    ingredients:document.getElementById("recipeIngredients").value.trim(),
    steps:document.getElementById("recipeSteps").value.trim(),
    time:Number(document.getElementById("recipeTime").value || 0),
    budget:Number(document.getElementById("recipeBudget").value || 0),
    source:document.getElementById("recipeSource").value.trim(),
    memo:document.getElementById("recipeMemo").value.trim(),
    photo:document.getElementById("recipePhoto").value.trim(),
    favorite:false
  };

  if(editingRecipeId) {

    const index = recipes.findIndex(
      item => item.id === editingRecipeId
    );

    if(index >= 0) {
      recipe.favorite = recipes[index].favorite;
      recipes[index] = recipe;
    }

  } else {
    recipes.unshift(recipe);
  }

  saveRecipes();

  document.getElementById("recipeFormArea").classList.add("hidden");
  document.getElementById("recipeListArea").classList.remove("hidden");

  renderRecipeList();
  alert("レシピを保存しました。");

}

/* レシピ詳細 */

function showRecipeDetail(id) {

  const recipe = recipes.find(item => item.id === id);
  if(!recipe) return;

  document.getElementById("recipeListArea").classList.add("hidden");
  document.getElementById("recipeFormArea").classList.add("hidden");
  document.getElementById("recipeDetailArea").classList.remove("hidden");

  const detail = document.getElementById("recipeDetail");
  detail.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = recipe.name;
  detail.appendChild(heading);

  if(recipe.photo) {
    const img = document.createElement("img");
    img.src = recipe.photo;
    img.alt = recipe.name;
    img.style.width = "100%";
    img.style.borderRadius = "12px";
    img.onerror = () => img.remove();
    detail.appendChild(img);
  }

  function addDetail(title,text) {
    const h = document.createElement("h3");
    h.textContent = title;
    const p = document.createElement("p");
    p.style.whiteSpace = "pre-wrap";
    p.textContent = text || "未登録";
    detail.appendChild(h);
    detail.appendChild(p);
  }

  addDetail("カテゴリー",recipe.category);
  addDetail("材料・分量",recipe.ingredients);
  addDetail("作り方",recipe.steps);
  addDetail("調理時間",recipe.time ? recipe.time+"分" : "");
  addDetail("予算",recipe.budget ? recipe.budget+"円" : "");
  addDetail("メモ",recipe.memo);

  if(recipe.source) {
    const link = document.createElement("a");
    link.href = recipe.source;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "元のレシピサイトを開く";
    detail.appendChild(link);
  }

  const edit = document.createElement("button");
  edit.className = "secondary";
  edit.textContent = "編集する";
  edit.style.marginTop = "15px";
  edit.addEventListener("click",()=>{
    openRecipeForm(id);
  });

  const remove = document.createElement("button");
  remove.className = "outline";
  remove.textContent = "削除する";
  remove.style.margin = "10px";
  remove.addEventListener("click",()=>{
    if(!confirm("このレシピを削除しますか？")) return;

    recipes = recipes.filter(item => item.id !== id);
    favorites = favorites.filter(item => item !== id);

    saveRecipes();
    saveData(STORAGE_KEYS.favorites,favorites);

    document.getElementById("recipeDetailArea").classList.add("hidden");
    document.getElementById("recipeListArea").classList.remove("hidden");

    renderRecipeList();
  });

  detail.appendChild(edit);
  detail.appendChild(remove);

}

 /* =====================================
   献立作成機能
===================================== */

let currentGeneratedPlan = {};

function getRecipeText(recipe) {
  return [
    recipe.name || "",
    recipe.category || "",
    recipe.ingredients || "",
    recipe.memo || ""
  ].join(" ");
}

function matchesPlanConditions(recipe, ingredients, avoid, maxTime) {

  if(!recipe.name) return false;

  if(avoid.length > 0) {
    const text = getRecipeText(recipe).toLowerCase();

    if(avoid.some(word => text.includes(word.toLowerCase()))) {
      return false;
    }
  }

  if(maxTime < 999 && recipe.time > maxTime) {
    return false;
  }

  if(ingredients.length > 0) {
    const text = getRecipeText(recipe).toLowerCase();

    if(!ingredients.some(word =>
      text.includes(word.toLowerCase())
    )) {
      return false;
    }
  }

  return true;
}

function findPlanRecipe(category, ingredients, avoid, maxTime, used) {

  let candidates = recipes.filter(recipe => {

    if(used.includes(recipe.id)) return false;

    if(!matchesPlanConditions(
      recipe,ingredients,avoid,maxTime
    )) return false;

    return recipe.category === category;
  });

  if(candidates.length === 0) {
    candidates = recipes.filter(recipe => {

      if(used.includes(recipe.id)) return false;

      if(!matchesPlanConditions(
        recipe,ingredients,avoid,maxTime
      )) return false;

      return true;
    });
  }

  if(candidates.length === 0) return null;

  return candidates[
    Math.floor(Math.random() * candidates.length)
  ];
}

function createMealForDay(ingredients,avoid,maxTime,used) {

  const categories = [
    ["主食","主食"],
    ["主菜","主菜"],
    ["副菜","副菜"],
    ["汁物","汁物"],
    ["小鉢","小鉢"]
  ];

  const result = {};

  categories.forEach(([key,category]) => {

    const recipe = findPlanRecipe(
      category,
      ingredients,
      avoid,
      maxTime,
      used
    );

    if(recipe) {
      result[key] = recipe;
      used.push(recipe.id);
    }

  });

  return result;
}

function createMealDay(ingredients,avoid,maxTime,used) {

  const breakfast = createMealForDay(
    ingredients,avoid,maxTime,used
  );

  const lunch = createMealForDay(
    ingredients,avoid,maxTime,used
  );

  const dinner = createMealForDay(
    ingredients,avoid,maxTime,used
  );

  return {
    breakfast,
    lunch,
    dinner
  };
}

function renderMealPlan(plan) {

  const container =
    document.getElementById("mealPlanResult");

  container.innerHTML = "";

  const days = Object.keys(plan);

  if(days.length === 0) {
    container.textContent = "献立がありません。";
    return;
  }

  days.forEach(key => {

    const day = plan[key];

    const card = document.createElement("div");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = key;
    card.appendChild(heading);

    const mealNames = [
      ["朝食","breakfast"],
      ["昼食","lunch"],
      ["夕食","dinner"]
    ];

    mealNames.forEach(([label,time]) => {

      const section = document.createElement("div");
      section.style.padding = "8px 0";
      section.style.borderTop = "1px solid #eee";

      const title = document.createElement("strong");
      title.textContent = label;

      section.appendChild(title);

      const meals = day[time] || {};

      const categories = [
        "主食","主菜","副菜","汁物","小鉢"
      ];

      categories.forEach(category => {

        const recipe = meals[category];

        const p = document.createElement("p");
        p.style.margin = "4px 0";
        p.style.fontSize = "13px";

        p.textContent = recipe
          ? `${category}：${recipe.name}`
          : `${category}：未登録`;

        section.appendChild(p);

      });

      card.appendChild(section);

    });

    container.appendChild(card);

  });

}

function generateMealPlan() {

  const people = Number(
    document.getElementById("planPeople").value
  );

  const days = Number(
    document.getElementById("planDays").value
  );

  const maxTime = Number(
    document.getElementById("planCookingTime").value
  );

  if(!people || people < 1 || people > 30) {
    alert("人数は1〜30人で入力してください。");
    return;
  }

  if(recipes.length === 0) {
    alert("先にレシピを登録してください。");
    showPage("recipePage");
    return;
  }

  const ingredients = document.getElementById(
    "planIngredients"
  ).value.split(/[、,，\s]+/).filter(Boolean);

  const avoid = document.getElementById(
    "planAvoid"
  ).value.split(/[、,，\s]+/).filter(Boolean);

  const used = [];

  currentGeneratedPlan = {};

  for(let i=0;i<days;i++) {

    const date = new Date();
    date.setDate(date.getDate()+i);

    const key = dateKey(date);

    currentGeneratedPlan[key] = createMealDay(
      ingredients,
      avoid,
      maxTime,
      used
    );

  }

  renderMealPlan(currentGeneratedPlan);

  document.getElementById("saveMealPlan")
    .classList.remove("hidden");

}

document.getElementById("makePlan")
  .addEventListener("click",generateMealPlan);

/* カレンダーへ保存 */

document.getElementById("saveMealPlan")
  .addEventListener("click",()=>{

    if(Object.keys(currentGeneratedPlan).length === 0) {
      alert("先に献立を作成してください。");
      return;
    }

    Object.entries(currentGeneratedPlan).forEach(
      ([date,day])=>{

        mealPlans[date] = {
          breakfast:day.breakfast,
          lunch:day.lunch,
          dinner:day.dinner
        };

      }
    );

    saveData(STORAGE_KEYS.plans,mealPlans);

    renderCalendar();

    alert("献立をカレンダーに保存しました！");

    showPage("homePage");

    selectedDate = new Date(
      Object.keys(currentGeneratedPlan)[0] + "T00:00:00"
    );

    renderCalendar();
    renderSelectedMeals();

  });
