<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#302f2b;--muted:#77736b;--line:#e6e1d7;--paper:#fffefa;--accent:#657b59;--soft:#eef2e9}
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 48px}.head{padding:12px 2px 18px;border-bottom:1px solid var(--line)}h1{font-size:27px;margin:0 0 5px;letter-spacing:.04em}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink)}.tabs button.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:var(--ink);width:100%;min-width:0}label{display:block;font-size:13px;color:var(--muted);margin:9px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.recipe{border-top:1px solid var(--line);padding:13px 0}.recipe:first-child{border:0}.recipe button{margin-top:8px}.tag{font-size:12px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:99px;display:inline-block}.ingredient{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}.hidden{display:none}.notice{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.result{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.result strong{display:block;margin-bottom:4px}.small{font-size:12px}.pill{border-radius:99px;padding:4px 8px;background:#f1eee7;font-size:12px}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}main{padding:14px 12px 36px}}
 .brand{display:flex;align-items:center;gap:12px}.brand-icon{width:54px;height:54px;border-radius:15px;box-shadow:0 2px 8px #30201422} 
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0;background:#f0ede5}.photo-thumb{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#f0ede5}.photo-empty{height:130px;border-radius:10px;background:linear-gradient(135deg,#eee9dd,#dce5d4);display:flex;align-items:center;justify-content:center;color:#777;font-size:13px;margin:8px 0}.recipe-card{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}.recipe-card .photo-thumb,.recipe-card .photo-empty{height:100px;margin:0}.tabwide{white-space:nowrap}.fieldhint{font-size:12px;color:var(--muted);margin-top:4px}

/* 月間献立カレンダー */
.mealcal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}
.mealcal-head button{min-height:42px}
.mealcal-title{font-size:19px;font-weight:700;text-align:center;flex:1}
.mealcal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden}
.mealcal-weekday,.mealcal-day{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 3px}
.mealcal-weekday{text-align:center;background:#f2f0e9;font-size:12px;font-weight:700}
.mealcal-day{background:#fffefa;min-height:94px;text-align:left;cursor:pointer}
.mealcal-day.other{background:#f7f6f2;color:#aaa}
.mealcal-day.today{background:#f0f5eb}
.mealcal-day.selected{outline:2px solid var(--accent);outline-offset:-2px;background:#edf3e8}
.mealcal-num{font-size:13px;font-weight:700;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%}
.mealcal-day.today .mealcal-num{background:var(--accent);color:white}
.mealcal-chip{display:block;font-size:10px;line-height:1.35;padding:2px 3px;margin-top:3px;border-radius:4px;background:#eef2e9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mealcal-chip.lunch{background:#fff1dc}.mealcal-chip.dinner{background:#e9eef8}
.mealcal-more{font-size:10px;color:var(--muted);margin-top:2px}
.mealcal-detail{margin-top:12px}
@media(max-width:520px){.mealcal-day{min-height:72px;padding:3px 2px}.mealcal-chip{font-size:9px;padding:2px 1px}.mealcal-weekday{font-size:11px;padding:5px 1px}.mealcal-num{width:21px;height:21px}}
</style></head><body><main>
<header class="head"><div class="brand"><div class="brand-icon" style="display:grid;place-items:center;background:#657b59;color:white;font-size:28px">🍚</div><div><h1>うちのごはん</h1><div class="sub">毎日のごはんを、もっと楽しく。</div></div></div></header>
<nav class="tabs" aria-label="メニュー"><button class="active" data-tab="calendar">📅 カレンダー</button><button data-tab="plan">献立を作る</button><button data-tab="search">レシピ検索</button><button data-tab="bento" class="tabwide">🍱 お弁当</button><button data-tab="add" class="tabwide">＋ レシピ追加</button><button data-tab="saved">お気に入り</button></nav>

<div id="calendar">
<section>
 <h2>📅 わが家の月間献立カレンダー</h2>
 <p class="muted">日付を押すと、その日の朝食・昼食・夕食を確認できます。献立を作成して「この献立を記録に保存」すると、ここに反映されます。</p>
 <div class="mealcal-head">
  <button class="btn" type="button" onclick="moveMealMonth(-1)">◀ 前月</button>
  <div id="mealMonthTitle" class="mealcal-title" aria-live="polite"></div>
  <button class="btn" type="button" onclick="moveMealMonth(1)">次月 ▶</button>
  <button class="btn" type="button" onclick="goMealToday()">今日</button>
 </div>
 <div id="mealMonthGrid"></div>
 <div id="mealDayDetail" class="mealcal-detail" aria-live="polite"></div>
 <div class="actions" style="margin-top:12px">
  <button class="btn primary" type="button" onclick="showTab('plan')">🍽 献立を作る</button>
  <button class="btn" type="button" onclick="showTab('saved')">保存した献立を見る</button>
 </div>
</section>
<section>
 <h3>🧾 最近の献立記録</h3>
 <div id="calendarRecentPlans" class="muted">まだ献立の記録はありません。</div>
</section>
</div>

<div id="search">
<section><h2>🔎 レシピを探す</h2><div class="row"><input id="searchInput" placeholder="料理名・食材で検索"><button class="btn primary" id="searchButton">検索</button></div><div id="searchResults"></div></section>
</div>

<div id="plan" class="hidden">
<section><h2>🍽 献立を考える</h2>
<div class="grid"><div><label>何日分？</label><input id="planDays" type="number" min="1" max="14" value="7"></div><div><label>何人分？</label><input id="people" type="number" min="1" max="20" value="4"></div></div>
<div class="grid"><div><label>1人1日あたりの予算（円）</label><input id="dailyBudget" type="number" min="0" value="800"></div><div><label>開始日</label><input id="planStartDate" type="date"></div></div>
<div class="grid"><div><label>朝食の予算（1人分）</label><input id="breakfastBudget" type="number" value="200"></div><div><label>昼食の予算（1人分）</label><input id="lunchBudget" type="number" value="250"></div><div><label>夕食の予算（1人分）</label><input id="dinnerBudget" type="number" value="350"></div></div>
<label>使いたい食材・希望</label><textarea id="planRequest" rows="2" placeholder="例：鶏むね肉、キャベツを使いたい。和食中心。"></textarea>
<div class="actions"><button class="btn primary" id="makePlan">献立を作る</button><button class="btn" id="makePlanLocal">登録レシピから作る</button></div>
<div id="planStatus" class="notice hidden"></div><div id="planResult"></div>
</section>
<section><h2>🛒 買い物リスト</h2><div id="shoppingArea"></div></section>
<section><h2>🥬 冷蔵庫・食品在庫</h2>
<div class="grid"><div><label>食材名</label><input id="inventoryName" placeholder="例：玉ねぎ"></div><div><label>数量</label><input id="inventoryQty" type="number" min="0" step="0.1" value="1"></div><div><label>単位</label><input id="inventoryUnit" placeholder="個・g・本など" value="個"></div><div><label>賞味期限</label><input id="inventoryExpiry" type="date"></div></div>
<button class="btn primary" id="addInventory">在庫に追加</button><div id="inventoryList"></div>
</section>
</div>

<div id="bento" class="hidden"><section><h2>🍱 お弁当</h2>
<div class="grid"><div><label>人数（1〜8人）</label><input id="bentoPeople" type="number" min="1" max="8" value="4"></div><div><label>1人あたりの予算（円）</label><input id="bentoBudget" type="number" min="0" value="400"></div></div>
<button class="btn primary" id="makeBento">お弁当のおかずを考える</button><div id="bentoResult"></div>
</section></div>

<div id="add" class="hidden"><section><h2>＋ レシピを追加</h2>
<label>料理名</label><input id="newName" placeholder="料理名">
<label>カテゴリー</label><select id="newCategory"><option value="主菜">主菜</option><option value="副菜">副菜</option><option value="主食">主食</option><option value="汁物">汁物</option><option value="小鉢">小鉢</option><option value="お弁当">お弁当</option></select>
<label>材料（1人分ずつ改行）</label><textarea id="newIngredients" rows="5" placeholder="鶏むね肉 100g&#10;醤油 大さじ1&#10;砂糖 小さじ1"></textarea>
<label>作り方</label><textarea id="newSteps" rows="5"></textarea>
<label>元のレシピサイトURL</label><input id="newSource" type="url" placeholder="https://...">
<label>メモ・味付けのポイント</label><textarea id="newTip" rows="2"></textarea>
<button class="btn primary" id="saveRecipe">レシピを保存</button>
<div id="addStatus" class="notice hidden"></div>
</section></div>

<div id="saved" class="hidden"><section><h2>⭐ お気に入り・アレンジ</h2><div id="savedRecipes"></div><h3>📅 保存した献立</h3><div id="savedMealPlans"></div></section></div>

 const fallback=all;

 const costOf=r=>Math.round((Number(r.cost)||0)*people/4);
 const usedByMeal={breakfast:new Set(),lunch:new Set(),dinner:new Set()};latestMealPlan=[];let html=`<h3 style="margin-top:18px">${people}人分の献立（${days}日間）</h3>`,grand=0;

  }

 }
 html+=`<p><strong>期間合計の概算：約${grand.toLocaleString()}円</strong></p><p class="muted">1日あたりの目安：約${Math.round(grand/days).toLocaleString()}円（3食分）。</p>`;
 $("planResult").innerHTML=html;renderShoppingList();

  const rows=allRows.filter(x=>!pantryHas(x.name));

  area.innerHTML=`<section>
    <h3>🛒 買い物リスト（${latestMealPlan.length}日分）</h3>
    <p class="muted">家にある食材リストに登録済みの材料は自動で除外しています。</p>
    ${ownedRows.length?`<div class="notice">🏠 家にあるため買わなくてよいもの：${ownedRows.map(x=>x.name).join("、")}</div>`:""}
    <div class="actions" style="margin:8px 0">
      <button class="btn" onclick="toggleShoppingChecks(true)">すべてチェック</button>
      <button class="btn" onclick="toggleShoppingChecks(false)">チェックを外す</button>
      <button class="btn" onclick="copyShoppingList()">リストをコピー</button><button class="btn" onclick="moveCheckedShoppingToInventory()">チェックした食材を在庫へ</button>
    </div>
    <div id="shoppingItems">
      ${rows.length?rows.map((x,i)=>`
        <label class="ingredient" style="display:flex;gap:10px;align-items:center">
          <input type="checkbox" class="shopcheck" style="width:auto" data-i="${i}">
          <span style="flex:1">${x.name}</span>
          <strong>${x.display}</strong>
        </label>
      `).join(""):`<p class="muted">買い足す食材はありません。</p>`}
    </div>
  </section>`;

  window.currentShoppingRows=rows;
}
function toggleShoppingChecks(value){document.querySelectorAll(".shopcheck").forEach(x=>x.checked=value)}
function copyShoppingList(){let rows=window.currentShoppingRows||[];let text=rows.map((x,i)=>{let amount=x.display||(x.unknown.join("・")||"適量");let checked=document.querySelector(`.shopcheck[data-i="${i}"]`)?.checked;return `${checked?"☑":"□"} ${x.name}：${amount}`}).join("\n");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>alert("買い物リストをコピーしたよ！")).catch(()=>prompt("このリストをコピーしてね",text))}else prompt("このリストをコピーしてね",text)}
$("makePlan").onclick=makePlan;
function runWebSearch(){let query=$("q").value.trim();if(!query){alert("料理名や食材を入力してね");return}let url="https://www.google.com/search?q="+encodeURIComponent(query+" レシピ");window.open(url,"_blank","noopener");}
$("webSearch").onclick=runWebSearch;
let pendingPhoto="";
$("newPhoto").onchange=()=>{let f=$("newPhoto").files[0];if(!f)return;if(!f.type.startsWith("image/")){alert("画像ファイルを選んでね");return}let reader=new FileReader();reader.onload=e=>{let im=new Image();im.onload=()=>{let canvas=document.createElement("canvas"),max=900,ratio=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*ratio);canvas.height=Math.round(im.height*ratio);canvas.getContext("2d").drawImage(im,0,0,canvas.width,canvas.height);pendingPhoto=canvas.toDataURL("image/jpeg",.72);$("photoPreview").src=pendingPhoto;$("photoPreview").classList.remove("hidden")};im.src=e.target.result};reader.readAsDataURL(f)};
 function importRecipeObject(data,sourceUrl){
 const ingredients=(data.ingredients||[]).map(x=>String(x).trim()).filter(Boolean);
 const steps=(data.instructions||[]).map(x=>String(x).trim()).filter(Boolean);
 if(!data.name||!ingredients.length||!steps.length)throw new Error("料理名・材料・作り方を十分に取得できませんでした");
 const id=Date.now()+Math.floor(Math.random()*1000);
 const r={id,n:String(data.name),c:String(data.category||"その他"),t:Number(data.time)||30,cost:Number(data.cost)||0,ing:ingredients.map(x=>[x,"適量"]),steps,source:sourceUrl||"",photo:"",custom:true};
 let a=JSON.parse(localStorage.getItem("uchiCustomRecipes")||"[]");a.unshift(r);localStorage.setItem("uchiCustomRecipes",JSON.stringify(a));return r;
}
function saveCustomRecipe(){
 const name=$("newName").value.trim(),category=$("newCategory").value,time=Number($("newTime").value)||30,cost=Number($("newCost").value)||0;
 const ingredients=$("newIngredients").value.split(/\n/).map(x=>x.trim()).filter(Boolean);
 const steps=$("newSteps").value.split(/\n/).map(x=>x.trim()).filter(Boolean);
 if(!name||!ingredients.length||!steps.length){alert("料理名・材料・作り方を入力してね");return}
 const id=Date.now();let a=JSON.parse(localStorage.getItem("uchiCustomRecipes")||"[]");
 a.unshift({id,n:name,c:category,t:time,cost,ing:ingredients.map(x=>{let m=x.match(/^(.+?)\s+(.+)$/);return m?[m[1],m[2]]:[x,"適量"]}),steps,source:$("newSource").value.trim(),tip:$("newTip").value.trim(),photo:pendingPhoto,custom:true});
 localStorage.setItem("uchiCustomRecipes",JSON.stringify(a));
 ["newName","newIngredients","newSteps","newSource","newTip"].forEach(k=>$(k).value="");$("newCost").value="";$("newTime").value="30";$("photoPreview").classList.add("hidden");pendingPhoto="";
 alert("レシピを登録したよ！");render();showTab("search");
}
$("saveCustom").onclick=saveCustomRecipe;
function renderCustomRecipes(){let a=JSON.parse(localStorage.getItem("uchiCustomRecipes")||"[]");$("customList").innerHTML=a.length?a.map(r=>`<div class="result"><strong>${r.n}</strong><p class="muted">${r.c}・${r.t}分</p><button class="btn" onclick="openRecipe(${r.id});showTab('search')">見る</button> <button class="btn" onclick="deleteCustom(${r.id})">削除</button></div>`).join(""):"登録したレシピはまだありません。"}
function deleteCustom(id){if(!confirm("このレシピを削除する？"))return;let a=JSON.parse(localStorage.getItem("uchiCustomRecipes")||"[]").filter(x=>x.id!==id);localStorage.setItem("uchiCustomRecipes",JSON.stringify(a));renderCustomRecipes();render()}
function markCooked(id,day,key){let a=JSON.parse(localStorage.getItem("uchiCooked")||"[]");a.unshift({id,day,key,date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem("uchiCooked",JSON.stringify(a));alert("作った記録を保存したよ！")}
function renderCooked(){let a=JSON.parse(localStorage.getItem("uchiCooked")||"[]");$("cookedList").innerHTML=a.length?a.map(x=>{let r=allRecipes().find(y=>y.id===x.id);return `<div class="result">${x.date}・${x.day}日目・${r?r.n:"レシピ"}</div>`}).join(""):"まだ記録はありません。"}
function searchRecipes(){
 const q=$("q").value.trim().toLowerCase(),cat=$("category").value;
 const list=allRecipes().filter(r=>(!cat||r.c===cat)&&(!q||[r.n,r.c,...(r.ing||[]).map(x=>x[0])].join(" ").toLowerCase().includes(q)));
 $("results").innerHTML=list.length?list.map(r=>`<div class="result"><strong>${r.n}</strong><p class="muted">${r.c}・${r.t}分・目安 ${Number(r.cost||0).toLocaleString()}円</p><button class="btn" onclick="openRecipe(${r.id})">レシピを見る</button></div>`).join(""):"見つかりませんでした。食材名や料理名を変えて検索してね。";
}
$("searchBtn").onclick=searchRecipes;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")searchRecipes()});
function openRecipe(id){
 const r=allRecipes().find(x=>x.id===id);if(!r)return;active=r;
 $("recipeDetail").innerHTML=`<h2>${r.n}</h2><p class="muted">${r.c}・${r.t}分・目安 ${Number(r.cost||0).toLocaleString()}円</p>${r.photo?`<img src="${r.photo}" alt="${r.n}" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px">`:""}<h3>材料</h3>${r.ing.map(x=>`<div class="ingredient"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}<h3>作り方</h3><ol>${r.steps.map(x=>`<li style="margin:8px 0">${x}</li>`).join("")}</ol>${r.tip?`<p class="notice">${r.tip}</p>`:""}${r.source?`<p class="muted">参考：${r.source}</p>`:""}<button class="btn" onclick="toggleSave(${r.id});openRecipe(${r.id})">${saved.includes(r.id)?"★ お気に入り解除":"☆ お気に入り登録"}</button><h3>人数を変更</h3><select id="scale" onchange="drawScaled(active)"><option value="1">1人分</option><option value="2">2人分</option><option value="4" selected>4人分</option><option value="6">6人分</option><option value="8">8人分</option></select><div id="scaled"></div><h3>アレンジメモ</h3><textarea id="variation" rows="3" placeholder="材料や味付けをどう変えたか記録"></textarea><button class="btn" onclick="saveVariation()">アレンジを保存</button>`;
 drawScaled(r);
}
function expiryPriority(r){return pantryItems.some(x=>r.ing.some(y=>y[0].includes(x)))?1:0}
function nutritionHint(r){return r.c==="サラダ・副菜"?"野菜を補いやすい一品":r.c==="汁物・スープ"?"水分と野菜を補いやすい一品":r.c==="ご飯もの"?"主食を中心にした一品":"主菜・副菜を組み合わせて栄養バランスを整えてね"}
function allRecipes(){return [...recipes,...JSON.parse(localStorage.getItem("uchiCustomRecipes")||"[]")]}
function render(){renderPantry();renderCustomRecipes();renderCooked();renderSaved();searchRecipes();renderBento();renderHomeMealCalendar()}
function showTab(name){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.id===name));if(name==="saved")renderSaved();if(name==="calendar")renderHomeMealCalendar();if(name==="bento")renderBento()}
document.querySelectorAll(".tab").forEach(x=>x.addEventListener("click",()=>showTab(x.dataset.tab)));
function makePlan(){makePlanBase();if(latestMealPlan.length){saveMealPlan(latestMealPlan);renderHomeMealCalendar()}}
function saveMealPlan(plan){
 const a=JSON.parse(localStorage.getItem("uchiSavedMealPlans")||"[]");
 a.unshift({date:new Date().toISOString(),days:plan});
 localStorage.setItem("uchiSavedMealPlans",JSON.stringify(a));
}
function renderSavedMealPlans(){
 const a=JSON.parse(localStorage.getItem("uchiSavedMealPlans")||"[]");
 const el=$("savedMealPlans");if(!el)return;
 el.innerHTML=a.length?a.map((p,i)=>`<div class="result"><strong>${new Date(p.date).toLocaleDateString("ja-JP")}の献立</strong><p>${p.days.length}日分</p><button class="btn" onclick="viewSavedPlan(${i})">献立を見る</button> <button class="btn" onclick="deleteSavedMealPlan(${i})">削除</button></div>`).join(""):"保存した献立はありません。";
}
function viewSavedPlan(i){
 const p=JSON.parse(localStorage.getItem("uchiSavedMealPlans")||"[]")[i];if(!p)return;
 $("savedPlanDetail").innerHTML=p.days.map(d=>`<div class="result"><strong>${d.day}日目</strong>${Object.entries(d.meals).map(([k,m])=>`<p>${k==="breakfast"?"朝食":k==="lunch"?"昼食":"夕食"}：${m.recipe.n}</p>`).join("")}</div>`).join("");
}
function deleteSavedMealPlan(i){let a=JSON.parse(localStorage.getItem("uchiSavedMealPlans")||"[]");a.splice(i,1);localStorage.setItem("uchiSavedMealPlans",JSON.stringify(a));renderSavedMealPlans();renderHomeMealCalendar()}
function renderBento(){
 const area=$("bentoResult");if(!area)return;
 const people=Math.max(1,Math.min(8,Number($("bentoPeople").value)||4));
 const budget=Math.max(0,Number($("bentoBudget").value)||0);
 const all=allRecipes().filter(r=>r.c!=="汁物・スープ");
 const picks=[...all].sort((a,b)=>Number(a.cost||0)-Number(b.cost||0)).slice(0,12);
 area.innerHTML=`<h3>${people}人分のお弁当候補</h3>`+picks.map(r=>`<div class="result"><strong>${r.n}</strong><p class="muted">目安 ${Math.round((Number(r.cost)||0)*people/4).toLocaleString()}円</p><button class="btn" onclick="openRecipe(${r.id});showTab('search')">レシピを見る</button></div>`).join("");
}
$("bentoPeople").onchange=renderBento;$("bentoBudget").onchange=renderBento;
function addBentoMemo(){let v=$("bentoMemo").value.trim();if(!v)return;let a=JSON.parse(localStorage.getItem("uchiBentoMemos")||"[]");a.unshift({text:v,date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem("uchiBentoMemos",JSON.stringify(a));$("bentoMemo").value="";renderBentoMemos()}
function renderBentoMemos(){let a=JSON.parse(localStorage.getItem("uchiBentoMemos")||"[]"),el=$("bentoMemos");if(el)el.innerHTML=a.map(x=>`<div class="result">${x.date}：${x.text}</div>`).join("")||"お弁当メモはありません。"}
$("saveBentoMemo").onclick=addBentoMemo;
renderBentoMemos();
 function courseLabelAI(course){
 const labels={
  staple:"主食",
  main:"主菜",
  soup:"汁物",
  side:"副菜",
  kobachi:"小鉢"
 };
 return labels[course]||course;
}

function moveCheckedShoppingToInventory(){
 const rows=window.currentShoppingRows||[];
 const checks=[...document.querySelectorAll(".shopcheck:checked")];
 if(!checks.length){
  alert("在庫に追加する食材にチェックを入れてね。");
  return;
 }
 const selected=checks
  .map(c=>rows[Number(c.dataset.i)])
  .filter(Boolean);
 selected.forEach(x=>{
  if(!pantryItems.some(y=>y.toLowerCase()===x.name.toLowerCase())){
   pantryItems.push(x.name);
  }
 });
 localStorage.setItem("uchiPantry",JSON.stringify(pantryItems));
 renderPantry();
 alert(selected.length+"品を家にある食材へ追加したよ！");
 renderShoppingList();
}

render();
renderMealCalendar();
 </script>
