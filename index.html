{id:10,n:"焼きそば",c:"麺類",t:15,cost:550,ing:[["焼きそば麺","4玉"],["豚こま肉","200g"],["キャベツ","1/4個"],["もやし","1袋"],["焼きそばソース","適量"],["油","小さじ2"]],steps:["肉と野菜を食べやすく切る。","肉、野菜の順に炒める。","麺を加え、水少量を振ってほぐす。","ソースを少しずつ加えて味を整える。"],tip:"ソースは商品ごとに塩分が違うので味見しながら。"},
{id:11,n:"親子丼",c:"ご飯もの",t:20,cost:700,ing:[["鶏もも肉","300g"],["玉ねぎ","1個"],["卵","6個"],["だし","200ml"],["しょうゆ","大さじ2"],["みりん","大さじ2"],["砂糖","小さじ2"],["ご飯","4人分"]],steps:["鶏肉を一口大、玉ねぎを薄切りにする。","だしと調味料で玉ねぎと鶏肉を煮る。","溶き卵を回し入れ、好みの半熟加減で火を止める。","ご飯にのせる。"],tip:"つゆは薄味にして、食べるときに調整できる。"},

{id:14,n:"豚汁",c:"汁物・スープ",t:30,cost:650,ing:[["豚こま肉","200g"],["大根","150g"],["にんじん","1/2本"],["ごぼう","1/2本"],["こんにゃく","1/2枚"],["長ねぎ","1/2本"],["だし","800ml"],["みそ","大さじ2〜3"]],steps:["具材を食べやすく切る。","鍋で豚肉を炒め、野菜を加える。","だしを注ぎ、具材が柔らかくなるまで煮る。","みそを溶き入れ、ねぎを加える。"],tip:"みそは最後に味を見ながら調整。"},
{id:15,n:"ナポリタン",c:"麺類",t:20,cost:600,ing:[["スパゲッティ","400g"],["ウインナー","6本"],["玉ねぎ","1個"],["ピーマン","2個"],["ケチャップ","大さじ6"],["牛乳","大さじ2"],["バター","15g"]],steps:["麺を表示時間通りにゆでる。","具材を切ってバターで炒める。","ケチャップを加えて軽く炒め、麺と牛乳を加えて和える。"],tip:"ケチャップは少なめから加え、最後に調整。"},
{id:16,n:"ポテトサラダ",c:"サラダ・副菜",t:30,cost:500,ing:[["じゃがいも","4個"],["きゅうり","1本"],["にんじん","1/3本"],["ハム","4枚"],["マヨネーズ","大さじ4"],["酢","小さじ1"],["塩こしょう","少々"]],steps:["じゃがいもとにんじんをゆでる。","じゃがいもをつぶし、酢を混ぜて冷ます。","きゅうりは薄切りにして水気を絞る。","具材とマヨネーズを混ぜる。"],tip:"マヨネーズは最初少なめにして調整。"},
{id:17,n:"カレーライス",c:"ご飯もの",t:40,cost:1000,ing:[["豚肉","300g"],["玉ねぎ","2個"],["にんじん","1本"],["じゃがいも","3個"],["カレールウ","4〜5皿分"],["水","700ml"],["ご飯","4人分"]],steps:["肉と野菜を食べやすく切る。","鍋で肉と野菜を炒め、水を加えて煮る。","具材が柔らかくなったら火を止めてルウを溶かす。","弱火でとろみがつくまで煮る。"],tip:"ルウは少なめに溶かして味を見て追加。"},

{id:19,n:"きんぴらごぼう",c:"サラダ・副菜",t:20,cost:350,ing:[["ごぼう","1本"],["にんじん","1/2本"],["ごま油","大さじ1"],["しょうゆ","大さじ1"],["みりん","大さじ1"],["砂糖","小さじ2"],["白ごま","適量"]],steps:["ごぼうとにんじんを細切りにする。","ごま油で炒める。","調味料を加え、汁気がなくなるまで炒める。","白ごまを振る。"],tip:"しょうゆは控えめから。"},

const detailSteps={
1:["鶏肉は厚い部分を開き、幅5mmほどの細切りにします。ピーマンは縦半分に切って種を取り、細切り。たけのこ・玉ねぎも同じくらいの細さにすると火の通りがそろいます。","鶏肉に片栗粉大さじ1をまぶします。肉の表面がうっすら白くなればOK。調味料（しょうゆ・オイスターソース・酒・砂糖）は小さい器で先に混ぜます。","フライパンにごま油を入れ中火で温めます。鶏肉を広げ、重なった部分をほぐしながら炒めます。表面の色が変わるまで約3〜4分。","玉ねぎ、たけのこ、ピーマンの順に加えて2〜3分炒めます。野菜が少ししんなりし、ピーマンの色が鮮やかになれば次へ。","合わせ調味料を回し入れ、全体を1〜2分炒めます。鶏肉の一番厚い部分を切り、中心まで白く火が通っていることを確認。味を見て、必要ならしょうゆを小さじ1ずつ足します。"],
2:["鶏肉はキッチンペーパーで水気を拭きます。厚い部分に包丁で切り込みを入れて開き、厚みを均一にします。皮に数か所フォークを刺すと縮みにくくなります。","しょうゆ・みりん・酒・砂糖を器で混ぜておきます。調味料を先に用意すると、焼いている途中で慌てません。","フライパンに油を薄くひき、中火で温めます。鶏肉を皮を下にして置き、ヘラで軽く押さえながら5〜6分焼きます。皮にこんがり焼き色がついたら裏返します。","弱火にしてふたをし、さらに5〜7分蒸し焼きにします。厚い部分に竹串を刺し、透明な肉汁が出るか確認。心配な場合は中心温度75℃で1分以上を目安にします。","余分な脂をペーパーで拭き、混ぜた調味料を加えます。中火で煮立て、スプーンで肉にかけながら1〜2分煮詰めます。泡が大きくなり、少しとろみが出たら完成。焦げやすいので目を離しません。"],
3:["玉ねぎは薄切りにします。豚肉が大きければ食べやすい幅に切り、調味料（しょうゆ・みりん・酒・生姜）を器で混ぜておきます。","フライパンに油を入れて中火で温め、豚肉を広げて炒めます。肉の赤い部分がほぼなくなったら玉ねぎを加えます。","玉ねぎが透き通って少ししんなりするまで2〜3分炒めます。焦げそうなら火を弱めます。","合わせ調味料を加え、全体に絡めながら1〜2分炒めます。肉の中心まで火が通り、汁が少し残る程度で火を止めます。濃ければ水を大さじ1加えます。"],
4:["じゃがいもは皮をむいて4等分、にんじんは小さめの乱切り、玉ねぎはくし形に切ります。じゃがいもは水に2〜3分さらし、ざるに上げます。","鍋に油少量（分量外）を入れ中火で温め、豚肉を炒めます。肉の色が変わったら玉ねぎ、にんじん、じゃがいもを加えて1〜2分炒めます。","だし、しょうゆ、みりん、砂糖を加えます。煮立ったらアクを取り、しらたきを加えます。","落としぶた（クッキングシートに穴を開けたものでも可）をし、弱めの中火で15〜20分煮ます。ふつふつ小さく泡が出る火加減を保ちます。","竹串をじゃがいもに刺し、すっと通れば火を止めます。煮崩れ防止のため強く混ぜず、鍋を軽く揺すります。10分ほど置くと味がなじみます。"],
5:["さばの表面の水分をペーパーで拭きます。皮に浅く十字の切り込みを入れます。生姜は薄切りにします。","鍋に水・酒・みりん・砂糖・生姜を入れて中火にかけ、煮立ったらさばを皮を上にして並べます。","再び煮立ったらアクを取り、落としぶたをして弱めの中火で8〜10分煮ます。煮汁が静かにふつふつする状態にします。","みそを小さな器に取り、煮汁を少し加えて溶いてから鍋に戻します。魚に煮汁をスプーンでかけ、さらに3〜5分煮ます。","身の中心まで熱くなり、箸でほぐれる状態なら完成。煮詰めすぎると塩辛くなるので、煮汁が少し残るところで火を止めます。"],
6:["玉ねぎを細かいみじん切りにします。フライパンで弱めの中火で炒め、透き通ったら皿に広げて冷まします。熱いまま肉に混ぜると脂が溶けるので、必ず冷まします。","パン粉に牛乳を混ぜてしっとりさせます。ボウルにひき肉、冷ました玉ねぎ、卵、パン粉、塩こしょうを入れます。","手を使って粘りが出るまで1〜2分混ぜます。4等分し、両手で数回キャッチボールするように空気を抜き、厚さ2cmほどの小判形に整え、中央を少しくぼませます。","フライパンに油を薄くひき中火で温めます。ハンバーグを並べ、触らず2〜3分焼き、底に焼き色がついたら裏返します。","弱火にしてふたをし、8〜10分蒸し焼きにします。中央に竹串を刺し、透明な肉汁が出るか確認。確実には中心温度75℃で1分以上を目安にします。","ハンバーグを皿に取り出します。同じフライパンにケチャップと中濃ソースを入れ、弱火で30秒ほど混ぜて温め、上からかけます。"],
7:["鶏肉は一口大、玉ねぎは薄切り、しめじは石づきを落としてほぐします。にんにくはみじん切りにします。","鍋に油を入れて中火で温め、にんにくを炒めます。香りが出たら鶏肉を皮目から焼き、表面に焼き色をつけます。中まで火を通す必要はありません。","玉ねぎとしめじを加えて2分ほど炒めます。玉ねぎが少ししんなりしたらトマト缶、水、コンソメを加えます。","煮立ったら弱火にし、ふたを少しずらして15〜20分煮ます。鍋底が焦げないよう、ときどき底から優しく混ぜます。","鶏肉の一番大きいものを切り、中心まで火が通っていることを確認します。酸味が強ければ砂糖を小さじ1/2ずつ加えて調整します。"],
8:["玉ねぎはみじん切り、鶏肉は1cm角に切ります。卵は1人2個を目安にボウルで溶き、牛乳を混ぜます。","フライパンにバター半量を溶かし、鶏肉を中火で炒めます。肉の表面の色が変わったら玉ねぎを加え、しんなりするまで炒めます。","ご飯を加えてほぐし、ケチャップをまず分量の7割ほど加えて炒めます。全体が均一な色になったら味見し、必要なら残りを加えて皿に盛ります。","フライパンを軽く拭き、残りのバターを溶かします。卵液を流し入れ、弱めの中火で菜箸を大きく動かしながら半熟状にします。","卵がまだ少し柔らかいところで火を止め、チキンライスにのせます。余熱で固まるので、焼きすぎないのがコツです。"],
9:["豆腐は2cm角に切ります。長ねぎ、にんにく、生姜はみじん切りにします。片栗粉は水大さじ2（分量外）で溶いておきます。","フライパンにごま油を入れ中火で熱し、にんにく・生姜・ねぎを30秒ほど炒めます。香りが出たら豚ひき肉を加え、そぼろ状になるまで炒めます。","みそ、しょうゆ、鶏ガラスープを加えて混ぜ、豆腐を崩さないように入れます。弱めの中火で3〜4分煮ます。","水溶き片栗粉をもう一度混ぜてから少しずつ回し入れ、優しく混ぜます。ふつふつと1分ほど加熱し、とろみがついたら完成。辛味は食べる人の皿でラー油を足します。"],
10:["キャベツは一口大、豚肉は食べやすい長さに切ります。麺は袋の口を少し開け、電子レンジで温めるとほぐしやすくなります（袋の表示を確認）。","フライパンに油を入れ中火で熱し、豚肉を炒めます。肉の赤い部分がなくなったらキャベツともやしを加えます。","野菜が少ししんなりしたら麺を加え、水大さじ2を振ってほぐします。無理に引っ張らず、箸で少しずつ分けます。","ソースをまず半量加えて混ぜ、味を見ながら足します。全体が熱くなり、湯気が立ったら完成。"],
11:["鶏肉は2cm角、玉ねぎは薄切りにします。卵はボウルに割り、白身を切るように軽く混ぜます。混ぜすぎなくて大丈夫です。","フライパンにだし、しょうゆ、みりん、砂糖、玉ねぎを入れ中火にかけます。煮立ったら鶏肉を加えます。","弱めの中火で5〜7分煮ます。鶏肉の大きいものを切り、中心まで火が通ったことを確認します。","溶き卵の2/3を回し入れ、ふたをして弱火で1分。残りの卵を加えて30秒ほど加熱し、ご飯にのせます。半熟が心配な場合は十分に加熱してください。"],
12:["大根とにんじんはいちょう切り、油揚げは短冊切り、豆腐はさいの目に切ります。乾燥具材を使う場合は袋の表示に従います。","鍋にだし、大根、にんじんを入れて中火にかけます。煮立ったら弱火にし、野菜に竹串が通るまで8〜10分煮ます。","豆腐と油揚げを加えて2分温めます。煮立たせすぎると豆腐が崩れやすいので、静かに温めます。","火を弱めるか止め、みそをお玉に取り、煮汁で溶いてから鍋に戻します。味を見て少しずつ追加します。"],
13:["乾燥わかめはたっぷりの水に5分ほど浸して戻し、ざるに上げます。きゅうりは薄い輪切りにします。","きゅうりに塩ひとつまみ（分量外）を振って5分置きます。手でぎゅっと絞るかペーパーで包んで水気を取ります。","酢・砂糖・しょうゆをボウルで混ぜ、砂糖が溶けたらきゅうりとわかめを加えます。","全体を和えて5分置き、味を見ます。酸味が強ければ砂糖を少量、薄ければしょうゆを数滴加えます。"],
14:["大根とにんじんはいちょう切り、ごぼうは斜め薄切りにして水にさらします。こんにゃくはスプーンでちぎり、長ねぎは小口切りにします。","鍋に少量の油を入れ中火で豚肉を炒めます。肉の色が変わったら大根・にんじん・ごぼう・こんにゃくを加えて2分炒めます。","だしを加え、煮立ったらアクを取り、弱めの中火で10〜15分煮ます。野菜に竹串が通ればOKです。","火を弱め、みそをお玉で煮汁に溶いて加えます。長ねぎを入れて1分温め、味を見てみそを調整します。"],
15:["大きな鍋に湯を沸かし、塩（湯1Lに小さじ1程度・任意）を入れます。スパゲッティを袋の表示時間どおりにゆでます。","玉ねぎとピーマンは薄切り、ウインナーは斜め切りにします。麺がゆで上がったら湯を切ります。","フライパンにバターを溶かし、ウインナー、玉ねぎ、ピーマンを中火で炒めます。玉ねぎが透き通ったらケチャップを加え、30秒ほど炒めます。","麺と牛乳を加えて全体を混ぜます。水分が足りず固いときはゆで汁を大さじ1ずつ加えます。味を見てケチャップを調整します。"],
16:["じゃがいもは皮をむいて2〜3cm角に切り、にんじんはいちょう切りにします。鍋に入れてかぶる程度の水を加え、柔らかくなるまで10〜15分ゆでます。","きゅうりは薄切りにして塩ひとつまみ（分量外）を振り、5分置いて水気をしっかり絞ります。ハムは短冊切りにします。","じゃがいもに竹串がすっと通ったら湯を捨て、弱火で鍋を揺すって水分を飛ばします。熱いうちに粗くつぶし、酢を混ぜます。","じゃがいもの湯気が落ち着いてから、きゅうり・にんじん・ハム・マヨネーズを混ぜます。塩こしょうで味を整え、冷蔵庫で冷やします。"],
17:["玉ねぎは薄切り、にんじんとじゃがいもは一口大、豚肉も大きければ切ります。じゃがいもは水にさらして水気を切ります。","鍋に油少量を入れ中火で豚肉を炒めます。色が変わったら玉ねぎ、にんじん、じゃがいもを加えて2分炒めます。","水を加えて煮立て、アクを取ります。弱めの中火で15〜20分煮て、じゃがいもに竹串が通るか確認します。","いったん火を止め、ルウを割り入れて溶かします。溶け残りがないよう底から混ぜます。","再び弱火にかけ、焦げないよう混ぜながら5分ほど煮ます。とろみがついたら完成。ルウは商品表示の水量を優先し、濃さは水で調整します。"],
18:["玉ねぎは薄切り、しめじは石づきを落としてほぐします。鮭の水気をペーパーで拭き、骨があれば取り除きます。","アルミホイルを大きめに4枚用意します。中央に玉ねぎを敷き、鮭を置き、しめじとバターをのせます。酒を各包みに分けて振ります。","ホイルの上下を合わせて2回折り、左右も折って蒸気が漏れにくい包みにします。","フライパンに包みを並べ、水を100mlほど入れます。ふたをして中火で沸かし、沸いたら弱火で12〜15分蒸します。水がなくならないよう途中で確認します。","包みを開け、鮭の中心まで火が通っているか確認します。熱い蒸気に注意。味が薄ければ食べる直前にポン酢やしょうゆを少量かけます。"],
19:["ごぼうはよく洗い、包丁の背で表面を軽くこそげます。斜め薄切りにしてから細切りにし、水に2〜3分さらして水気を切ります。にんじんも細切りにします。","フライパンにごま油を入れ中火で温め、ごぼうとにんじんを3〜4分炒めます。ごぼうが少ししんなりすればOKです。","しょうゆ・みりん・砂糖を加え、汁気が少なくなるまで混ぜながら炒めます。焦げそうなら火を弱めます。","火を止めて白ごまを振ります。味が濃い場合は次回しょうゆを少し減らします。"],
20:["乾燥わかめは水で戻して水気を切ります。卵は器に割り、箸で白身を切るように混ぜます。","鍋に水と鶏ガラスープの素を入れて中火で沸かします。味見をして、塩気が強ければ水を足します。","わかめを加えて30秒ほど煮ます。スープを軽く混ぜながら、溶き卵を細く回し入れます。","卵を入れたらすぐに混ぜず、10秒ほど待ってから大きく一度混ぜます。しょうゆとごま油を加えて火を止めます。"]
};

function render(){let q=$("q").value.trim().toLowerCase(),c=$("category").value;let arr=recipes.filter(r=>(!c||r.c===c)&&(!q||(r.n+" "+r.c+" "+r.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(q)));$("list").innerHTML=arr.length?arr.map(r=>`<div class="recipe"><span class="tag">${r.c}</span><h3 style="margin-top:7px">${r.n}</h3><div class="muted">${r.t}分・4人前の目安 ${r.cost.toLocaleString()}円</div><button class="btn" onclick="openRecipe(${r.id})">レシピを見る</button> <button class="btn" onclick="toggleSave(${r.id})">${saved.includes(r.id)?"★ 保存済み":"☆ お気に入り"}</button></div>`).join(""):"該当するレシピがありません。"}
$("q").oninput=render;$("category").onchange=render;$("clear").onclick=()=>{$("q").value="";$("category").value="";render()};
function openRecipe(id){active=recipes.find(r=>r.id===id);let r=active,n=4;$("detail").classList.remove("hidden");$("detail").innerHTML=`<h2>${r.n}</h2><span class="tag">${r.c}</span><p class="muted">基本レシピ・目安 ${r.t}分</p><label>作る人数</label><input id="scale" type="number" min="1" max="20" value="4"><div id="scaled"></div><h3 style="margin-top:16px">作り方（初めてでも安心）</h3><div class="notice">先に材料を全部切り、調味料を量っておくと失敗しにくいよ。火加減はコンロによって違うので、焦げそうなら弱めてね。</div><ol>${(detailSteps[r.id]||r.steps).map((s,i)=>`<li style="margin:10px 0;line-height:1.65"><strong>手順${i+1}</strong><br>${s}</li>`).join("")}</ol><div class="notice">安全のポイント：肉・魚・卵は中心まで十分に加熱してね。生肉を触った手や器具は、ほかの食材に使う前に洗おう。</div><div class="notice">味の調整：${r.tip}</div><h3 style="margin-top:16px">わが家のアレンジを記録</h3><textarea id="variation" rows="3" placeholder="例：しょうゆを少し減らした。家族にはこの味が好評。"></textarea><button class="btn primary" style="width:100%;margin-top:8px" onclick="saveVariation()">アレンジを保存</button>`;let scale=$("scale");scale.oninput=()=>drawScaled(r);drawScaled(r);$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
function drawScaled(r){let n=Math.max(1,Math.min(20,Number($("scale").value)||4));$("scaled").innerHTML=`<div class="muted" style="margin:9px 0">材料・調味料（${n}人前）</div>`+r.ing.map(([name,qty])=>`<div class="ingredient"><span>${name}</span><strong>${scaleQty(qty,n/4)}</strong></div>`).join("")}
function scaleQty(q,f){if(f===1)return q;let m=q.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return q+" ×"+f.toFixed(2);let v=Number(m[1])*f;return (Math.round(v*100)/100)+m[2]}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("uchiSaved",JSON.stringify(saved));render()}
function saveVariation(){let txt=$("variation").value.trim();if(!txt){alert("アレンジ内容を入力してね");return}let a=JSON.parse(localStorage.getItem("uchiVariants")||"[]");a.unshift({id:active.id,name:active.n,text:txt,date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem("uchiVariants",JSON.stringify(a));$("variation").value="";alert("アレンジを保存したよ！")}
function renderSaved(){let a=JSON.parse(localStorage.getItem("uchiVariants")||"[]");$("savedList").innerHTML=(saved.length?`<h3>お気に入り</h3>`+saved.map(id=>{let r=recipes.find(x=>x.id===id);return `<div class="result"><strong>${r.n}</strong><button class="btn" onclick="openRecipe(${id});showTab('search')">レシピを見る</button></div>`}).join(""):"")+(a.length?`<h3 style="margin-top:16px">アレンジ履歴</h3>`+a.map(v=>`<div class="result"><strong>${v.name} <span class="pill">${v.date}</span></strong>${v.text}</div>`).join(""):"")||"まだ保存したレシピはありません。"}
function makePlan(){let days=Number($("days").value),people=Math.max(1,Math.min(20,Number($("people").value)||4)),budget=Math.max(100,Number($("budget").value)||2000),limit=Number($("time").value),stock=$("stock").value.toLowerCase().split(/[、,，\s]+/).filter(Boolean);let available=recipes.filter(r=>r.t<=limit);let used=new Set(),out=[];for(let d=0;d<days;d++){let candidates=available.filter(r=>!used.has(r.id));if(!candidates.length){used.clear();candidates=available}candidates.sort((a,b)=>{let am=stock.filter(s=>(a.n+" "+a.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(s)).length,bm=stock.filter(s=>(b.n+" "+b.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(s)).length;return bm-am});let chosen=candidates.find(r=>r.cost*people/4<=budget)||candidates[candidates.length-1];used.add(chosen.id);out.push(chosen)}$("planResult").innerHTML=`<h3 style="margin-top:18px">提案した献立（${people}人・${days}日）</h3>`+out.map((r,i)=>`<div class="result"><strong>${i+1}日目：${r.n}</strong><span class="muted">${r.c}・約${Math.round(r.cost*people/4).toLocaleString()}円・${r.t}分</span><button class="btn" onclick="showTab('search');openRecipe(${r.id})">レシピを見る</button></div>`).join("")+`<p class="muted">概算合計：約${Math.round(out.reduce((s,r)=>s+r.cost*people/4,0)).toLocaleString()}円（主菜・料理1品ずつの提案。副菜・汁物は別途追加できます）</p>`}
$("makePlan").onclick=makePlan;render();
</script></main></body></html>
