<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うちのごはん">
<title>うちのごはん</title>

<style>
:root {
  --ink:#302f2b;
  --muted:#77736b;
  --line:#e6e1d7;
  --paper:#fffefa;
  --accent:#657b59;
  --soft:#eef2e9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:#f7f5ef;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
main { max-width:850px; margin:auto; padding:16px 12px 112px; }
header { padding:12px 4px 18px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:12px; }
.brand-icon {
  width:54px; height:54px; border-radius:15px; display:grid; place-items:center;
  background:var(--accent); color:white; font-size:28px;
}
h1 { font-size:25px; margin:0 0 5px; }
h2 { font-size:19px; margin:0 0 12px; }
h3 { font-size:16px; margin:16px 0 8px; }
.sub,.muted { color:var(--muted); font-size:13px; }
.tabs {
  position:fixed; z-index:1000; left:50%; transform:translateX(-50%); bottom:0;
  width:min(100%,850px); display:flex; gap:7px; overflow-x:auto;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,254,250,.97); border-top:1px solid var(--line);
  box-shadow:0 -4px 16px rgba(0,0,0,.06); backdrop-filter:blur(10px);
}
.tabs button { flex:0 0 auto; white-space:nowrap; padding:10px 12px; font-size:12px; }
button,.btn {
  border:1px solid var(--line); background:white; border-radius:11px;
  padding:11px 14px; font-size:14px; color:var(--ink); cursor:pointer;
}
button.active,.primary { background:var(--accent); color:white; border-color:var(--accent); }
button:disabled { opacity:.5; cursor:not-allowed; }
.mini-btn { padding:4px 8px; font-size:11px; border-radius:7px; }
section.card {
  background:var(--paper); border:1px solid var(--line);
  border-radius:15px; padding:15px; margin:12px 0;
}
input,select,textarea {
  width:100%; min-width:0; padding:11px; border:1px solid var(--line);
  border-radius:10px; background:white; color:var(--ink); font:inherit;
}
label { display:block; font-size:13px; color:var(--muted); margin:10px 0 5px; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.row,.actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.hidden { display:none!important; }
.notice { background:var(--soft); border-radius:10px; padding:11px; font-size:13px; margin-top:10px; }
.result { padding:12px; border:1px solid var(--line); border-radius:11px; margin:9px 0; }
.tag { display:inline-block; padding:4px 8px; border-radius:20px; background:var(--soft); color:var(--accent); font-size:12px; }
.photo { width:100%; max-height:230px; object-fit:cover; border-radius:12px; margin-top:8px; }
.page-title { margin:8px 0 14px; }
.small { font-size:12px; color:var(--muted); }
.full { width:100%; margin-top:10px; }

details.dish-detail {
  width:100%; margin:4px 0; padding:6px 8px; border-radius:8px;
  background:#faf8f2; border:1px solid var(--line);
}
details.dish-detail summary {
  cursor:pointer; display:flex; align-items:center;
  justify-content:space-between; gap:8px; flex-wrap:wrap; list-style:none;
}
details.dish-detail summary::-webkit-details-marker { display:none; }
details.dish-detail .dish-body {
  margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);
  font-size:13px; line-height:1.6;
}

.calendar-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
.calendar-title { flex:1; text-align:center; font-size:19px; font-weight:bold; }
.calendar-grid {
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
  border-top:1px solid var(--line); border-left:1px solid var(--line); border-radius:10px; overflow:hidden;
}
.calendar-weekday,.calendar-day {
  min-width:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px 3px;
}
.calendar-weekday { text-align:center; background:#f2f0e9; font-size:12px; font-weight:bold; }
.calendar-day {
  width:100%; min-height:78px; background:white; text-align:left;
  border-radius:0; display:block; padding:4px 3px; overflow:hidden;
}
.calendar-day:focus { outline:2px solid var(--accent); outline-offset:-2px; }
.calendar-day.other { background:#f7f6f2; color:#aaa; }
.calendar-day.today { background:#f0f5eb; }
.calendar-day.selected { outline:2px solid var(--accent); outline-offset:-2px; }
.calendar-number { font-size:13px; font-weight:bold; }
.calendar-meal {
  display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  font-size:9px; padding:2px; margin-top:3px; border-radius:4px; background:#eef2e9;
}
.calendar-meal.lunch { background:#fff1dc; }
.calendar-meal.dinner { background:#e9eef8; }
.home-calendar-card { padding:12px; }
.calendar-legend { margin-top:10px; text-align:center; }
.home-quick-grid .card { min-width:0; margin:0; }
.home-cost-number { display:block; font-size:25px; color:var(--accent); }

@media(max-width:520px) {
  .calendar-day { min-height:68px; padding:3px 2px; }
  .calendar-weekday { font-size:11px; }
  .calendar-meal { font-size:8px; padding:2px 1px; }
  .grid { gap:7px; }
  .home-quick-grid { grid-template-columns:1fr 1fr; }
}

.cost-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:12px 0; }
.cost-box { background:var(--soft); border-radius:12px; padding:12px 8px; text-align:center; }
.cost-box strong { display:block; font-size:19px; color:var(--accent); margin-top:4px; }
.purchase-row { border:1px solid var(--line); border-radius:11px; padding:10px; margin:8px 0; }
.purchase-grid { display:grid; grid-template-columns:1.2fr .8fr .8fr; gap:7px; }
.purchase-grid input { padding:8px; }
.cost-bar-row { display:grid; grid-template-columns:70px 1fr 76px; gap:7px; align-items:center; margin:8px 0; font-size:12px; }
.cost-bar { height:13px; background:var(--soft); border-radius:10px; overflow:hidden; }
.cost-bar span { display:block; height:100%; background:var(--accent); border-radius:10px; }

@media(max-width:520px) {
  .cost-summary { grid-template-columns:1fr 1fr; }
  .purchase-grid { grid-template-columns:1fr 1fr; }
}

.taste-guide { background:#fffaf0!important; border:1px solid #e5d8bd!important; }
.taste-guide .result { background:#fffefa; }
.taste-filters button { padding:8px 10px; font-size:12px; }
.taste-card {
  border:1px solid #e8dfcf; background:#fffefa; border-radius:12px;
  padding:12px; margin:9px 0; box-shadow:2px 3px 0 rgba(100,80,50,.07);
}
.taste-card h3 { margin:0 0 6px; }
.taste-ratio { font-weight:700; color:#657b59; }
.taste-card .small { line-height:1.7; }
.recipe-scrap-card {
  background:#fffdf5; border:1px solid #e8dfcf; border-radius:13px;
  padding:13px; margin:10px 0; box-shadow:2px 3px 0 rgba(90,70,40,.07);
}
.recipe-scrap-card:before { content:"📎"; float:right; }
</style>
</head>

    <div>
