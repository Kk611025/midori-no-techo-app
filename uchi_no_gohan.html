<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>うちのごはん</title>
<style>
:root{--ink:#302f2b;--muted:#77736b;--line:#e6e1d7;--paper:#fffefa;--accent:#657b59;--soft:#eef2e9}
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 48px}.head{padding:12px 2px 18px;border-bottom:1px solid var(--line)}h1{font-size:27px;margin:0 0 5px;letter-spacing:.04em}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button,.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink)}.tabs button.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:var(--ink);width:100%;min-width:0}label{display:block;font-size:13px;color:var(--muted);margin:9px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.recipe{border-top:1px solid var(--line);padding:13px 0}.recipe:first-child{border:0}.recipe button{margin-top:8px}.tag{font-size:12px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:99px;display:inline-block}.ingredient{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}.hidden{display:none}.notice{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.result{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.result strong{display:block;margin-bottom:4px}.small{font-size:12px}.pill{border-radius:99px;padding:4px 8px;background:#f1eee7;font-size:12px}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}main{padding:14px 12px 36px}}
</style></head><body><main>
<header class="head"><h1>うちのごはん</h1><div class="sub">基本のレシピから、わが家の味を育てる料理帳</div></header>
<nav class="tabs" aria-label="メニュー"><button class="active" data-tab="search">レシピを探す</button><button data-tab="plan">献立を考える</button><button data-tab="saved">お気に入り・アレンジ</button></nav>
<div id="search">
<section><h2>🔎 レシピ検索</h2><input id="q" placeholder="料理名・食材で検索（例：鶏肉、玉ねぎ）"><div class="row" style="margin-top:9px"><select id="category"><option value="">すべてのジャンル</option><option>和食</option><option>洋食</option><option>中華</option><option>麺類</option><option>ご飯もの</option><option>汁物・スープ</option><option>サラダ・副菜</option></select><button class="btn" id="clear">クリア</button></div></section>
<section><h2>📖 基本レシピ</h2><div class="muted">基本は4人前・控えめな味付け。材料の分量は人数に合わせて計算できます。</div><div id="list"></div></section>
<section id="detail" class="hidden"></section>
</div>
<div id="plan" class="hidden">
<section><h2>🍽 献立を考える</h2><div class="grid"><div><label for="days">献立の日数</label><select id="days"><option value="1">今日だけ</option><option value="3">3日分</option><option value="7">1週間分</option></select></div><div><label for="people">人数</label><input id="people" type="number" min="1" max="20" value="4"></div><div><label for="budget">予算（1日分・合計）</label><input id="budget" type="number" min="100" step="100" value="2000"></div><div><label for="time">調理時間の目安</label><select id="time"><option value="30">30分以内</option><option value="45">45分以内</option><option value="60">60分以内</option></select></div></div><label for="stock">冷蔵庫にある食材（読点・カンマ・空白で区切る）</label><textarea id="stock" rows="3" placeholder="例：鶏肉、玉ねぎ、卵、キャベツ"></textarea><button class="btn primary" id="makePlan" style="width:100%;margin-top:12px">この条件で献立を作る</button><div id="planResult" aria-live="polite"></div><div class="notice">予算は登録した概算価格による目安です。地域・季節・購入店で変わります。食材を入力すると一致する料理を優先します。</div></section>
</div>
<div id="saved" class="hidden"><section><h2>⭐ お気に入り・アレンジ記録</h2><div id="savedList" class="muted">まだ保存したレシピはありません。</div></section></div>
</main>
<script>
const recipes=[
{id:1,n:"鶏肉のチンジャオロース",c:"中華",t:25,cost:850,ing:[["鶏もも肉","300g"],["ピーマン","5個"],["たけのこ水煮","150g"],["玉ねぎ","1/2個"],["しょうゆ","大さじ1.5"],["オイスターソース","大さじ1"],["酒","大さじ1"],["砂糖","小さじ1"],["片栗粉","大さじ1"],["ごま油","大さじ1"]],steps:["鶏肉は細切りにして片栗粉をまぶす。","野菜は細切りにする。","フライパンに油を熱し、鶏肉を炒める。","野菜を加えて火を通し、調味料を加えて全体に絡める。"],tip:"味を見て、しょうゆを少量ずつ足す。"},
{id:2,n:"鶏の照り焼き",c:"和食",t:25,cost:900,ing:[["鶏もも肉","2枚（約600g）"],["しょうゆ","大さじ2"],["みりん","大さじ2"],["酒","大さじ2"],["砂糖","大さじ1"],["油","小さじ1"]],steps:["鶏肉の厚い部分を開いて厚みをそろえる。","皮目から焼き、焼き色がついたら裏返す。","ふたをして弱めの中火で火を通す。","余分な脂を拭き、調味料を加えて煮絡める。"],tip:"甘さは砂糖で、塩味はしょうゆで少しずつ調整。"},

{id:4,n:"肉じゃが",c:"和食",t:40,cost:950,ing:[["豚こま肉","250g"],["じゃがいも","4個"],["玉ねぎ","1個"],["にんじん","1本"],["しらたき","1袋"],["だし","300ml"],["しょうゆ","大さじ2"],["みりん","大さじ2"],["砂糖","大さじ1"]],steps:["野菜を食べやすい大きさに切る。","鍋で肉と野菜を軽く炒める。","だしと調味料を加え、落としぶたをして煮る。","じゃがいもが柔らかくなったら火を止め、少し置いて味を含ませる。"],tip:"煮詰めすぎると濃くなるので、最後に味を確認。"},
{id:5,n:"さばの味噌煮",c:"和食",t:30,cost:900,ing:[["さば切り身","4切れ"],["生姜","1かけ"],["水","150ml"],["酒","100ml"],["みそ","大さじ2"],["みりん","大さじ2"],["砂糖","大さじ1"]],steps:["生姜を薄切りにする。","鍋に水・酒・みりん・砂糖を煮立て、さばを入れる。","落としぶたをして煮る。","みそを煮汁で溶いて加え、煮汁をかけながら仕上げる。"],tip:"みその塩分に差があるため、みそは控えめから。"},
{id:6,n:"ハンバーグ",c:"洋食",t:40,cost:1100,ing:[["合いびき肉","500g"],["玉ねぎ","1個"],["卵","1個"],["パン粉","大さじ6"],["牛乳","大さじ3"],["塩","小さじ1/3"],["こしょう","少々"],["ケチャップ","大さじ3"],["中濃ソース","大さじ2"]],steps:["玉ねぎをみじん切りにして炒め、冷ます。","ひき肉・卵・パン粉・牛乳・調味料と混ぜる。","4等分して空気を抜き、中央をくぼませる。","両面を焼き、ふたをして中まで火を通す。","ケチャップとソースを温めてかける。"],tip:"ソースは別添えにすると各自で濃さを調整できる。"},
{id:7,n:"鶏肉のトマト煮",c:"洋食",t:35,cost:950,ing:[["鶏もも肉","500g"],["玉ねぎ","1個"],["カットトマト","1缶"],["しめじ","1袋"],["にんにく","1かけ"],["コンソメ","小さじ2"],["水","100ml"],["油","小さじ2"]],steps:["鶏肉を一口大、野菜を食べやすく切る。","鍋でにんにくと鶏肉を焼く。","玉ねぎ・きのこ・トマト・水・コンソメを加える。","ふたをして15〜20分煮る。"],tip:"酸味が強いときは砂糖を少量加える。"},
{id:8,n:"オムライス",c:"洋食",t:30,cost:750,ing:[["ご飯","茶碗4杯分"],["鶏肉","200g"],["玉ねぎ","1/2個"],["卵","8個"],["ケチャップ","大さじ6"],["牛乳","大さじ2"],["バター","20g"]],steps:["鶏肉と玉ねぎを炒め、ご飯を加える。","ケチャップで味付けして皿に盛る。","卵に牛乳を混ぜ、バターで半熟に焼く。","チキンライスに卵をのせる。"],tip:"ケチャップは控えめに入れ、食べるときに追加できる。"},
{id:9,n:"麻婆豆腐",c:"中華",t:20,cost:650,ing:[["木綿豆腐","2丁"],["豚ひき肉","200g"],["長ねぎ","1/2本"],["にんにく","1かけ"],["生姜","1かけ"],["みそ","大さじ1"],["しょうゆ","大さじ1"],["鶏ガラスープ","200ml"],["片栗粉","大さじ1"],["ごま油","小さじ2"]],steps:["豆腐を角切り、ねぎ・にんにく・生姜を刻む。","ひき肉と香味野菜を炒める。","みそ・しょうゆ・スープを加え、豆腐を煮る。","水溶き片栗粉でとろみをつける。"],tip:"辛味を足したい場合は取り分け後にラー油を加える。"},
{id:10,n:"焼きそば",c:"麺類",t:15,cost:550,ing:[["焼きそば麺","4玉"],["豚こま肉","200g"],["キャベツ","1/4個"],["もやし","1袋"],["焼きそばソース","適量"],["油","小さじ2"]],steps:["肉と野菜を食べやすく切る。","肉、野菜の順に炒める。","麺を加え、水少量を振ってほぐす。","ソースを少しずつ加えて味を整える。"],tip:"ソースは商品ごとに塩分が違うので味見しながら。"},
{id:11,n:"親子丼",c:"ご飯もの",t:20,cost:700,ing:[["鶏もも肉","300g"],["玉ねぎ","1個"],["卵","6個"],["だし","200ml"],["しょうゆ","大さじ2"],["みりん","大さじ2"],["砂糖","小さじ2"],["ご飯","4人分"]],steps:["鶏肉を一口大、玉ねぎを薄切りにする。","だしと調味料で玉ねぎと鶏肉を煮る。","溶き卵を回し入れ、好みの半熟加減で火を止める。","ご飯にのせる。"],tip:"つゆは薄味にして、食べるときに調整できる。"},
{id:12,n:"具だくさん味噌汁",c:"汁物・スープ",t:20,cost:350,ing:[["豆腐","1丁"],["大根","150g"],["にんじん","1/2本"],["油揚げ","1枚"],["だし","800ml"],["みそ","大さじ2〜3"]],steps:["野菜と油揚げを食べやすく切る。","だしで火の通りにくい野菜から煮る。","豆腐と油揚げを加える。","火を弱め、みそを溶き入れる。"],tip:"みそは大さじ2から溶き、味を見て足す。"},
{id:13,n:"きゅうりとわかめの酢の物",c:"サラダ・副菜",t:15,cost:300,ing:[["きゅうり","2本"],["乾燥わかめ","5g"],["酢","大さじ2"],["砂糖","大さじ1"],["しょうゆ","小さじ1/2"]],steps:["わかめを戻す。","きゅうりを薄切りにして軽く塩もみし、水気を絞る。","調味料を混ぜ、具材と和える。"],tip:"酸味や甘さは少しずつ調整。"},
{id:14,n:"豚汁",c:"汁物・スープ",t:30,cost:650,ing:[["豚こま肉","200g"],["大根","150g"],["にんじん","1/2本"],["ごぼう","1/2本"],["こんにゃく","1/2枚"],["長ねぎ","1/2本"],["だし","800ml"],["みそ","大さじ2〜3"]],steps:["具材を食べやすく切る。","鍋で豚肉を炒め、野菜を加える。","だしを注ぎ、具材が柔らかくなるまで煮る。","みそを溶き入れ、ねぎを加える。"],tip:"みそは最後に味を見ながら調整。"},
{id:15,n:"ナポリタン",c:"麺類",t:20,cost:600,ing:[["スパゲッティ","400g"],["ウインナー","6本"],["玉ねぎ","1個"],["ピーマン","2個"],["ケチャップ","大さじ6"],["牛乳","大さじ2"],["バター","15g"]],steps:["麺を表示時間通りにゆでる。","具材を切ってバターで炒める。","ケチャップを加えて軽く炒め、麺と牛乳を加えて和える。"],tip:"ケチャップは少なめから加え、最後に調整。"},
{id:16,n:"ポテトサラダ",c:"サラダ・副菜",t:30,cost:500,ing:[["じゃがいも","4個"],["きゅうり","1本"],["にんじん","1/3本"],["ハム","4枚"],["マヨネーズ","大さじ4"],["酢","小さじ1"],["塩こしょう","少々"]],steps:["じゃがいもとにんじんをゆでる。","じゃがいもをつぶし、酢を混ぜて冷ます。","きゅうりは薄切りにして水気を絞る。","具材とマヨネーズを混ぜる。"],tip:"マヨネーズは最初少なめにして調整。"},
{id:17,n:"カレーライス",c:"ご飯もの",t:40,cost:1000,ing:[["豚肉","300g"],["玉ねぎ","2個"],["にんじん","1本"],["じゃがいも","3個"],["カレールウ","4〜5皿分"],["水","700ml"],["ご飯","4人分"]],steps:["肉と野菜を食べやすく切る。","鍋で肉と野菜を炒め、水を加えて煮る。","具材が柔らかくなったら火を止めてルウを溶かす。","弱火でとろみがつくまで煮る。"],tip:"ルウは少なめに溶かして味を見て追加。"},
{id:18,n:"鮭のホイル焼き",c:"和食",t:25,cost:950,ing:[["生鮭","4切れ"],["玉ねぎ","1/2個"],["しめじ","1袋"],["バター","20g"],["酒","大さじ2"],["塩こしょう","少々"]],steps:["玉ねぎを薄切り、しめじをほぐす。","アルミホイルに玉ねぎ、鮭、しめじをのせる。","酒とバターを加えて包む。","フライパンに並べ、水を少量入れてふたをし、蒸し焼きにする。"],tip:"しょうゆやポン酢は食べる直前に少量ずつ。"},
{id:19,n:"きんぴらごぼう",c:"サラダ・副菜",t:20,cost:350,ing:[["ごぼう","1本"],["にんじん","1/2本"],["ごま油","大さじ1"],["しょうゆ","大さじ1"],["みりん","大さじ1"],["砂糖","小さじ2"],["白ごま","適量"]],steps:["ごぼうとにんじんを細切りにする。","ごま油で炒める。","調味料を加え、汁気がなくなるまで炒める。","白ごまを振る。"],tip:"しょうゆは控えめから。"},
{id:20,n:"卵とわかめのスープ",c:"汁物・スープ",t:10,cost:250,ing:[["卵","2個"],["乾燥わかめ","4g"],["水","800ml"],["鶏ガラスープの素","小さじ2"],["しょうゆ","小さじ1"],["ごま油","少々"]],steps:["鍋に水と鶏ガラスープの素を入れて沸かす。","わかめを加える。","溶き卵を細く流し入れる。","しょうゆとごま油で整える。"],tip:"鶏ガラスープの素は商品によって塩分が異なるので控えめに。"}
];
let saved=JSON.parse(localStorage.getItem("uchiSaved")||"[]"), active=null;
const $=id=>document.getElementById(id);
function showTab(tab){["search","plan","saved"].forEach(x=>$(x).classList.toggle("hidden",x!==tab));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="saved")renderSaved()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function render(){let q=$("q").value.trim().toLowerCase(),c=$("category").value;let arr=recipes.filter(r=>(!c||r.c===c)&&(!q||(r.n+" "+r.c+" "+r.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(q)));$("list").innerHTML=arr.length?arr.map(r=>`<div class="recipe"><span class="tag">${r.c}</span><h3 style="margin-top:7px">${r.n}</h3><div class="muted">${r.t}分・4人前の目安 ${r.cost.toLocaleString()}円</div><button class="btn" onclick="openRecipe(${r.id})">レシピを見る</button> <button class="btn" onclick="toggleSave(${r.id})">${saved.includes(r.id)?"★ 保存済み":"☆ お気に入り"}</button></div>`).join(""):"該当するレシピがありません。"}
$("q").oninput=render;$("category").onchange=render;$("clear").onclick=()=>{$("q").value="";$("category").value="";render()};
function openRecipe(id){active=recipes.find(r=>r.id===id);let r=active,n=4;$("detail").classList.remove("hidden");$("detail").innerHTML=`<h2>${r.n}</h2><span class="tag">${r.c}</span><p class="muted">基本レシピ・目安 ${r.t}分</p><label>作る人数</label><input id="scale" type="number" min="1" max="20" value="4"><div id="scaled"></div><h3 style="margin-top:16px">作り方</h3><ol>${r.steps.map(s=>`<li style="margin:7px 0">${s}</li>`).join("")}</ol><div class="notice">味の調整：${r.tip}</div><h3 style="margin-top:16px">わが家のアレンジを記録</h3><textarea id="variation" rows="3" placeholder="例：しょうゆを少し減らした。家族にはこの味が好評。"></textarea><button class="btn primary" style="width:100%;margin-top:8px" onclick="saveVariation()">アレンジを保存</button>`;let scale=$("scale");scale.oninput=()=>drawScaled(r);drawScaled(r);$("detail").scrollIntoView({behavior:"smooth",block:"start"})}
function drawScaled(r){let n=Math.max(1,Math.min(20,Number($("scale").value)||4));$("scaled").innerHTML=`<div class="muted" style="margin:9px 0">材料・調味料（${n}人前）</div>`+r.ing.map(([name,qty])=>`<div class="ingredient"><span>${name}</span><strong>${scaleQty(qty,n/4)}</strong></div>`).join("")}
function scaleQty(q,f){if(f===1)return q;let m=q.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return q+" ×"+f.toFixed(2);let v=Number(m[1])*f;return (Math.round(v*100)/100)+m[2]}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("uchiSaved",JSON.stringify(saved));render()}
function saveVariation(){let txt=$("variation").value.trim();if(!txt){alert("アレンジ内容を入力してね");return}let a=JSON.parse(localStorage.getItem("uchiVariants")||"[]");a.unshift({id:active.id,name:active.n,text:txt,date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem("uchiVariants",JSON.stringify(a));$("variation").value="";alert("アレンジを保存したよ！")}
function renderSaved(){let a=JSON.parse(localStorage.getItem("uchiVariants")||"[]");$("savedList").innerHTML=(saved.length?`<h3>お気に入り</h3>`+saved.map(id=>{let r=recipes.find(x=>x.id===id);return `<div class="result"><strong>${r.n}</strong><button class="btn" onclick="openRecipe(${id});showTab('search')">レシピを見る</button></div>`}).join(""):"")+(a.length?`<h3 style="margin-top:16px">アレンジ履歴</h3>`+a.map(v=>`<div class="result"><strong>${v.name} <span class="pill">${v.date}</span></strong>${v.text}</div>`).join(""):"")||"まだ保存したレシピはありません。"}
function makePlan(){let days=Number($("days").value),people=Math.max(1,Math.min(20,Number($("people").value)||4)),budget=Math.max(100,Number($("budget").value)||2000),limit=Number($("time").value),stock=$("stock").value.toLowerCase().split(/[、,，\s]+/).filter(Boolean);let available=recipes.filter(r=>r.t<=limit);let used=new Set(),out=[];for(let d=0;d<days;d++){let candidates=available.filter(r=>!used.has(r.id));if(!candidates.length){used.clear();candidates=available}candidates.sort((a,b)=>{let am=stock.filter(s=>(a.n+" "+a.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(s)).length,bm=stock.filter(s=>(b.n+" "+b.ing.map(x=>x[0]).join(" ")).toLowerCase().includes(s)).length;return bm-am});let chosen=candidates.find(r=>r.cost*people/4<=budget)||candidates[candidates.length-1];used.add(chosen.id);out.push(chosen)}$("planResult").innerHTML=`<h3 style="margin-top:18px">提案した献立（${people}人・${days}日）</h3>`+out.map((r,i)=>`<div class="result"><strong>${i+1}日目：${r.n}</strong><span class="muted">${r.c}・約${Math.round(r.cost*people/4).toLocaleString()}円・${r.t}分</span><button class="btn" onclick="showTab('search');openRecipe(${r.id})">レシピを見る</button></div>`).join("")+`<p class="muted">概算合計：約${Math.round(out.reduce((s,r)=>s+r.cost*people/4,0)).toLocaleString()}円（主菜・料理1品ずつの提案。副菜・汁物は別途追加できます）</p>`}
$("makePlan").onclick=makePlan;render();
</script></main></body></html>
